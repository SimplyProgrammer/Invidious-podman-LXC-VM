proxy_cache_path /var/cache/nginx/media
    levels=1:2
    keys_zone=media_cache:20m
    max_size=2g
    inactive=12d
    use_temp_path=off;

# cache status in access logs
log_format cache_status
    '$remote_addr "$uri" '
    'status=$status '
    'cache=$upstream_cache_status '
    'upstream=$upstream_addr '
    'upstream_status=$upstream_status '
    'upstream_time=$upstream_response_time '
    'upstream_header_time=$upstream_header_time '
    'cache_control="$upstream_http_cache_control" '
    'expires="$upstream_http_expires" '
    'x_accel_expires="$upstream_http_x_accel_expires" '
    'pragma="$upstream_http_pragma" '
    'set_cookie="$upstream_http_set_cookie" '
    'vary="$upstream_http_vary" '
    'range="$http_range" '
    'slice="$slice_range" '
    'bytes=$body_bytes_sent '
    'content_range="$upstream_http_content_range" '
    'time=$request_time';

server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/access.log cache_status;
    error_log /var/log/nginx/error.log warn;

    location ~ /(latest_version|videoplayback) {
        slice 8m;
        
        proxy_cache media_cache;
        proxy_cache_key "$scheme$proxy_host$request_uri$slice_range";

        proxy_ignore_headers Expires;
        proxy_cache_valid 200 206 30s;
    
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_lock_age 5s;
    
        proxy_set_header Range $slice_range;
        proxy_set_header If-Range "";
    
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    
        proxy_pass http://invidious-app:3000;
    
        add_header X-Cache-Status $upstream_cache_status always;
   	}

    location / {
        return 404;
    }
}
